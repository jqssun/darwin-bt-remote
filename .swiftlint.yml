included:
  - BTRemote
  - BTHIDKit

excluded:
  - DerivedData
  - .build
  - app

disabled_rules:
  - multiple_closures_with_trailing_closure
  - opening_brace
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool

analyzer_rules:
  - unused_import

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 1
  excluded:
    - id
    - x
    - y
    - z
